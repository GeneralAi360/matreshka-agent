name: Matreshka package validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'dev/**'

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deterministic 0.5 development package validation and negative self-tests
        run: >-
          python3 -B plugins/matreshka-agent/scripts/validate_dev_05.py
          plugins/matreshka-agent --marketplace-root . --self-test

      - name: Matreshka 0.5 development component integrity
        run: >-
          python3 -B plugins/matreshka-agent/scripts/check_dev_05.py
          plugins/matreshka-agent --marketplace-root .

      - name: Cross-skill behavioral contract coverage
        run: >-
          python3 -B plugins/matreshka-agent/scripts/check_dev_05_behavioral_contracts.py
          plugins/matreshka-agent

      - name: Targeted G2 delivery-versus-rigor regression
        run: >-
          python3 -B plugins/matreshka-agent/scripts/evaluate_g2_rigor.py

      - name: Automatic Security-by-Design hardening families
        run: >-
          python3 -B plugins/matreshka-agent/scripts/check_security_hardening.py
          plugins/matreshka-agent --marketplace-root .

      - name: Run-state synchronizer self-test
        run: >-
          python3 -B plugins/matreshka-agent/scripts/sync_run_state.py --self-test

      - name: Context hot-path budget
        run: >-
          python3 -B plugins/matreshka-agent/scripts/check_context_budget.py
          plugins/matreshka-agent

      - name: Context Optimizer peer bridge
        run: >-
          python3 -B plugins/matreshka-agent/scripts/check_context_optimizer_peer.py

      - name: Checkout Context Optimizer peer
        uses: actions/checkout@v4
        with:
          repository: GeneralAi360/Matreshk-context-optimizer
          ref: main
          path: .peer/context-optimizer

      - name: Context Optimizer real peer scenario matrix
        env:
          MATRESHKA_CONTEXT_OPTIMIZER_HOME: ${{ github.workspace }}/.peer/context-optimizer
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          peer = "plugins/matreshka-agent/scripts/context_optimizer_peer.py"
          project = "plugins/matreshka-agent"

          def auto(signal):
              proc = subprocess.run(
                  [
                      sys.executable, "-B", peer,
                      "--project", project,
                      "--provider", "none",
                      "--execute",
                      "--signal", json.dumps(signal, separators=(",", ":")),
                      "auto",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
              )
              outer = json.loads(proc.stdout)
              assert outer["status"] == "COMPLETED", outer
              return outer["result"]

          new_project = auto({"scenario":"NEW_PROJECT","baseline_exists":False})
          assert new_project["command"] == "start", new_project
          assert new_project["decision"]["mode"] == "NEW_PROJECT_BASELINE", new_project
          assert new_project["baseline_candidate"]["persist_by_controller"] is True, new_project
          assert new_project["bridge"]["snapshotId"].startswith("CTXSNAP-"), new_project

          existing = auto({"scenario":"EXISTING_PROJECT","baseline_exists":False})
          assert existing["command"] == "adopt", existing
          assert existing["decision"]["mode"] == "EXISTING_PROJECT_ADOPTION", existing

          resumed = auto({
              "scenario":"CONTINUE_PROJECT",
              "baseline_exists":True,
              "resumed":True,
              "hours_since_last_audit":30,
          })
          assert resumed["command"] == "resume", resumed
          assert resumed["decision"]["mode"] == "RESUME_RECONCILIATION", resumed

          quiet = auto({"scenario":"CONTINUE_PROJECT","baseline_exists":True})
          assert quiet["status"] == "SKIPPED", quiet
          assert quiet["decision"]["mode"] == "NO_TRIGGER", quiet

          pressure = auto({
              "scenario":"CONTINUE_PROJECT",
              "baseline_exists":True,
              "repeated_file_reads":4,
          })
          assert pressure["command"] == "check", pressure
          assert pressure["decision"]["mode"] == "PRESSURE_EVENT", pressure
          assert pressure["bridge"]["trigger"]["nextCheck"], pressure

          proc = subprocess.run(
              [
                  sys.executable, "-B", peer,
                  "--project", project,
                  "--provider", "none",
                  "--execute",
                  "optimize",
              ],
              check=True,
              capture_output=True,
              text=True,
              encoding="utf-8",
          )
          optimize_outer = json.loads(proc.stdout)
          assert optimize_outer["status"] == "COMPLETED", optimize_outer
          optimize = optimize_outer["result"]
          assert optimize["command"] == "optimize", optimize
          assert optimize["mutation"] == "NOT_APPLIED", optimize

          print("PASS: Context Optimizer real peer scenario matrix")
          PY

      - name: Native repeatability matrix contract
        run: >-
          python3 -B plugins/matreshka-agent/scripts/evaluate_native_repeatability.py
          --validate-plan

      - name: Autopilot regression-class hardening
        run: >-
          python3 -B plugins/matreshka-agent/scripts/check_autopilot_regressions.py
          plugins/matreshka-agent --marketplace-root .

      - name: Read-only 0.5 development package doctor
        run: >-
          python3 -B plugins/matreshka-agent/scripts/doctor_dev_05.py
          plugins/matreshka-agent --marketplace-root .