name: Matreshka package validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'dev/**'

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deterministic package validation and negative self-tests
        run: >-
          python3 -B plugins/matreshka-agent/scripts/validate_package.py
          plugins/matreshka-agent --marketplace-root . --self-test

      - name: Read-only package doctor
        run: >-
          python3 -B plugins/matreshka-agent/scripts/doctor.py
          plugins/matreshka-agent --marketplace-root .
