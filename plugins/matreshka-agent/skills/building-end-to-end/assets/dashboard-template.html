<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matreshka Run</title>
<style>
:root{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light dark;
  --bg:Canvas;
  --text:CanvasText;
  --muted:color-mix(in srgb,CanvasText 58%,transparent);
  --line:color-mix(in srgb,CanvasText 14%,transparent);
  --soft:color-mix(in srgb,CanvasText 5%,transparent);
  --good:#16834a;
  --warn:#a86f00;
  --bad:#b42318;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
.wrap{max-width:1240px;margin:0 auto;padding:34px 28px 56px}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:26px}
.brand{font-size:1rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.runid{font-size:.82rem;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
h1{font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.08;margin:28px 0 0;letter-spacing:-.035em;overflow-wrap:anywhere}
.updated{font-size:.82rem;color:var(--muted);text-align:right;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:12px}
.badge,.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:.76rem;font-weight:700;line-height:1;white-space:nowrap}
.summary{border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px}
.summary-top{display:flex;justify-content:space-between;gap:20px;align-items:end}
.eyebrow,.metric-label,.section-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}
.progress-num{font-size:2rem;font-weight:800;line-height:1}
.progress{height:12px;border-radius:999px;background:var(--soft);overflow:hidden;margin:16px 0 9px}
.progress>div{height:100%;background:var(--text);border-radius:inherit;transition:width .25s}
.muted{color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:14px 0}
.card{min-width:0;border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--bg);overflow:hidden}
.metric-label{margin-bottom:10px}
.metric-value{font-size:clamp(1.45rem,2.6vw,2.25rem);font-weight:800;line-height:1.04;letter-spacing:-.035em;overflow-wrap:anywhere;word-break:break-word}
.metric-value.compact{font-size:clamp(1.12rem,1.8vw,1.55rem);line-height:1.15}
.metric-note{margin-top:9px;color:var(--muted);font-size:.87rem;line-height:1.38;overflow-wrap:anywhere}
.section-title{margin:30px 0 12px}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:14px}
.list{display:grid;gap:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-title{min-width:0;overflow-wrap:anywhere}
.row-sub{font-size:.8rem;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.row-right{display:flex;gap:10px;align-items:center}
.duration{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.status-good{border-color:color-mix(in srgb,var(--good) 55%,var(--line));color:var(--good)}
.status-warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));color:var(--warn)}
.status-bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));color:var(--bad)}
.authority{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.authority span{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.82rem;overflow-wrap:anywhere}
.footer-card{margin-top:14px}
.next{font-weight:750;font-size:1rem;line-height:1.4;overflow-wrap:anywhere}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.empty{color:var(--muted);font-style:italic}
.browser-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.browser-grid div{padding:8px 0;font-size:.84rem;overflow-wrap:anywhere}
@media(max-width:900px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:22px 16px 40px}.header{display:block}.updated{text-align:left;margin-top:12px}.badges{justify-content:flex-start}.metrics{grid-template-columns:1fr}.summary-top{align-items:flex-start}.row{grid-template-columns:1fr;gap:8px}.row-right{justify-content:space-between}.authority,.browser-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div id="app">Загрузка состояния Matreshka…</div></div>
<script>
let lastGood=null;
const RU={
  scenario:{NEW_PROJECT:"Новый проект",CONTINUE_PROJECT:"Продолжение проекта",EXISTING_PROJECT:"Существующий проект",NOT_APPLICABLE:"—"},
  mode:{INTERVIEW:"Интервью",ASSISTED:"С сопровождением",FULL_AUTO:"Полный автомат",GUIDED:"Интервью",AUTONOMOUS_LOCAL:"Полный автомат",NOT_APPLICABLE:"—"},
  profile:{MAXIMUM_SPEED:"Максимальная скорость",BALANCED:"Сбалансированный",MAXIMUM_QUALITY:"Максимальное качество",SPEED:"Максимальная скорость",QUALITY:"Максимальное качество"},
  status:{PASS:"Пройдено",COMPLETE:"Завершено",VERIFIED:"Проверено",APPROVED:"Одобрено",PARTIAL:"Частично",PARTIALLY_VERIFIED:"Частично проверено",IN_PROGRESS:"В работе",ACTIVE:"В работе",PENDING:"Ожидает",NOT_STARTED:"Не начато",BLOCKED:"Заблокировано",FAILED:"Ошибка",HANDOFF_REQUIRED:"Нужна передача",NOT_RUN:"Не запускалось",NOT_APPLICABLE:"Не требуется",UNAVAILABLE:"Недоступно"},
  stage:{source:"Исходный бриф и требования",g1:"Полнота уточнений G1",g2:"Независимая сверка брифа и спецификации G2",spec:"Спецификация",plan:"План и трассировка G3",implementation:"Разработка RED → GREEN",review:"Код-ревью и повторная проверка",technical:"Техническая проверка",g4:"Независимая приёмка G4",finish:"Завершение"}
};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function tr(map,v){return map?.[v]||String(v??"—")}
function statusClass(v){if(["PASS","COMPLETE","VERIFIED","APPROVED"].includes(v))return"status-good";if(["FAILED","BLOCKED"].includes(v))return"status-bad";return"status-warn"}
function statusLabel(v){return tr(RU.status,v)}
function fmtInt(v){return Number.isFinite(Number(v))?new Intl.NumberFormat("ru-RU").format(Number(v)):"—"}
function fmtTokens(v){const n=Number(v);if(!Number.isFinite(n))return"Недоступно";if(n>=1e6)return(n/1e6).toFixed(n>=1e7?1:2).replace(".",",")+" млн";if(n>=1e3)return(n/1e3).toFixed(n>=1e5?0:1).replace(".",",")+" тыс.";return fmtInt(n)}
function fmtDuration(sec){const n=Math.max(0,Math.round(Number(sec)||0)),h=Math.floor(n/3600),m=Math.floor((n%3600)/60),s=n%60;if(h)return`${h} ч ${String(m).padStart(2,"0")} мин`;if(m)return`${m} мин ${String(s).padStart(2,"0")} с`;return`${s} с`}
function parseTime(v){const t=Date.parse(v||"");return Number.isFinite(t)?t:null}
function totalElapsed(s){const t=s.timing||{};if(Number.isFinite(Number(t.elapsedSeconds)))return Number(t.elapsedSeconds);const a=parseTime(t.startedAt),b=parseTime(t.finishedAt)||Date.now();return a?Math.max(0,(b-a)/1000):null}
function stageWeight(v){if(["PASS","COMPLETE","VERIFIED","APPROVED"].includes(v))return 1;if(["PARTIAL","PARTIALLY_VERIFIED"].includes(v))return .5;if(["IN_PROGRESS","ACTIVE"].includes(v))return .25;return 0}
function overall(stages){return stages.length?Math.round(stages.reduce((a,x)=>a+stageWeight(x.status),0)/stages.length*100):0}
function currentStage(stages){for(let i=stages.length-1;i>=0;i--){if(!["PASS","COMPLETE","VERIFIED","APPROVED"].includes(stages[i].status))return stages[i]}return stages[stages.length-1]||null}
function stageTitle(x){return RU.stage[x.id]||x.title||x.id}
function yes(v){return v?"Разрешено":"Нет"}
function usageValue(u){if(u.status==="EXACT"&&Number.isFinite(Number(u.totalTokens)))return fmtTokens(u.totalTokens);if(u.status==="PARTIAL"&&Number.isFinite(Number(u.observedTokens)))return"Учтено "+fmtTokens(u.observedTokens);return"Недоступно"}
function usageNote(u){if(u.status==="EXACT")return`Вход ${fmtTokens(u.inputTokens)} · выход ${fmtTokens(u.outputTokens)}`;if(u.status==="PARTIAL")return`Только доступные счётчики · агентных ходов ${fmtInt(u.turnsUsed||0)}`;return`Host не отдаёт точный счётчик · агентных ходов ${fmtInt(u.turnsUsed||0)}`}
function render(s){
  lastGood=s;
  const r=s.requirements||{},sec=s.security||{},auth=s.authority||{},tests=s.tests||{},usage=s.usage||{},timing=s.timing||{},browser=s.browser||{};
  const stages=s.stages||[],tasks=s.tasks||[],progress=overall(stages),cur=currentStage(stages);
  const passedStages=stages.filter(x=>stageWeight(x.status)===1).length,partialStages=stages.filter(x=>stageWeight(x.status)>.25&&stageWeight(x.status)<1).length;
  const coverage=r.total?Math.round((r.verified||0)/r.total*100):0,elapsed=totalElapsed(s);
  const stageRows=stages.map(x=>`<div class="row"><div class="row-title">${esc(stageTitle(x))}</div><div class="row-right">${Number.isFinite(Number(x.durationSeconds))?`<span class="duration">${esc(fmtDuration(x.durationSeconds))}</span>`:""}<span class="pill ${statusClass(x.status)}">${esc(statusLabel(x.status))}</span></div></div>`).join("");
  const taskRows=tasks.map(x=>`<div class="row"><div><div class="row-title"><b>${esc(x.id)}</b> ${esc(x.title||"")}</div>${Number.isFinite(Number(x.durationSeconds))?`<div class="row-sub">${esc(fmtDuration(x.durationSeconds))}</div>`:""}</div><span class="pill ${statusClass(x.status)}">${esc(statusLabel(x.status))}</span></div>`).join("");
  const browserBlock=browser.relevant?`<hr><div class="metric-label">Браузерная проверка</div><div class="browser-grid"><div>Фреймворк: <b>${esc(browser.framework||"не определён")}</b></div><div>Режим: <b>${esc(browser.mode||"—")}</b></div><div>E2E: <b>${esc(statusLabel(browser.e2eStatus||"PENDING"))}</b></div><div>Browser G4: <b>${esc(statusLabel(browser.g4Status||"PENDING"))}</b></div><div>Console findings: <b>${fmtInt(browser.consoleFindings||0)}</b></div><div>Network findings: <b>${fmtInt(browser.networkFindings||0)}</b></div></div>${browser.blockedReason?`<div class="metric-note">Блокер: ${esc(browser.blockedReason)}</div>`:""}`:"";
  document.getElementById("app").innerHTML=`
    <div class="header"><div><div class="brand">Matreshka Agent</div><div class="runid">${esc(s.runId||"")}</div><h1>${esc(s.title||"Проект")}</h1></div><div><div class="updated">Обновлено: ${esc(s.updatedAt||"неизвестно")}</div><div class="badges"><span class="badge">${esc(tr(RU.scenario,s.scenario))}</span><span class="badge">${esc(tr(RU.mode,s.mode))}</span><span class="badge">${esc(tr(RU.profile,s.profile))}</span>${s.complexityTier?`<span class="badge">Ярус ${esc(s.complexityTier)}</span>`:""}</div></div></div>
    <div class="summary"><div class="summary-top"><div><div class="eyebrow">Общий прогресс</div><div class="muted">${passedStages} из ${stages.length} этапов пройдено${partialStages?` · ${partialStages} частично`:""}</div></div><div class="progress-num">${progress}%</div></div><div class="progress"><div style="width:${progress}%"></div></div><div class="muted">Итоговый контроль: ${esc(statusLabel(s.blindAcceptance||s.verification||"PENDING"))}</div></div>
    <div class="metrics">
      <div class="card"><div class="metric-label">Покрытие брифа</div><div class="metric-value">${coverage}%</div><div class="metric-note">${fmtInt(r.verified||0)} из ${fmtInt(r.total||0)} требований подтверждено</div></div>
      <div class="card"><div class="metric-label">Этап сейчас</div><div class="metric-value compact">${esc(cur?stageTitle(cur):"Завершено")}</div><div class="metric-note">${esc(cur?statusLabel(cur.status):"Все этапы завершены")}</div></div>
      <div class="card"><div class="metric-label">Общее время</div><div class="metric-value">${elapsed==null?"Недоступно":esc(fmtDuration(elapsed))}</div><div class="metric-note">Разработка: ${Number.isFinite(Number(timing.implementationSeconds))?esc(fmtDuration(timing.implementationSeconds)):"недоступно"}</div></div>
      <div class="card"><div class="metric-label">Токены</div><div class="metric-value">${esc(usageValue(usage))}</div><div class="metric-note">${esc(usageNote(usage))}</div></div>
    </div>
    <div class="metrics">
      <div class="card"><div class="metric-label">Задачи</div><div class="metric-value">${tasks.filter(x=>stageWeight(x.status)===1).length}<span class="muted"> / ${tasks.length}</span></div><div class="metric-note">${tasks.filter(x=>["PARTIAL","PARTIALLY_VERIFIED","IN_PROGRESS","ACTIVE"].includes(x.status)).length} требуют внимания</div></div>
      <div class="card"><div class="metric-label">Тесты</div><div class="metric-value">${fmtInt(tests.passed||0)}</div><div class="metric-note">Ошибок: ${fmtInt(tests.failed||0)} · пропущено: ${fmtInt(tests.skipped||0)}</div></div>
      <div class="card"><div class="metric-label">Требования</div><div class="metric-value">${fmtInt(r.total||0)}</div><div class="metric-note">Подтверждено ${fmtInt(r.verified||0)} · отложено ${fmtInt(r.deferred||0)} · снято ${fmtInt(r.dropped||0)}</div></div>
      <div class="card"><div class="metric-label">Безопасность</div><div class="metric-value">${fmtInt(sec.proved||0)}<span class="muted"> / ${fmtInt(sec.required||0)}</span></div><div class="metric-note">Заблокировано: ${fmtInt(sec.blocked||0)}</div></div>
    </div>
    <div class="section-title">Этапы</div><div class="card"><div class="list">${stageRows||'<div class="empty">Этапы ещё не записаны</div>'}</div></div>
    <div class="section-title">Ход сборки</div><div class="two"><div class="card"><div class="list">${taskRows||'<div class="empty">Задачи ещё не сформированы</div>'}</div></div><div class="card"><div class="metric-label">Разрешения</div><div class="authority"><span>Локальные изменения: <b>${yes(auth.localWrites)}</b></span><span>Git commit: <b>${yes(auth.gitHistory)}</b></span><span>Git push: <b>${yes(auth.gitRemote)}</b></span><span>Сеть: <b>${yes(auth.network)}</b></span><span>Секреты: <b>${yes(auth.secrets)}</b></span><span>Deploy: <b>${yes(auth.deploy)}</b></span><span>Браузер: <b>${yes(auth.browserInteraction)}</b></span><span>Запуск процессов: <b>${yes(auth.localProcess)}</b></span></div><hr><div class="metric-label">Проверки</div><div class="row"><div>Техническая проверка</div><span class="pill ${statusClass(s.verification)}">${esc(statusLabel(s.verification||"PENDING"))}</span></div><div class="row"><div>Независимая приёмка G4</div><span class="pill ${statusClass(s.blindAcceptance)}">${esc(statusLabel(s.blindAcceptance||"PENDING"))}</span></div>${browserBlock}</div></div>
    <div class="card footer-card"><div class="metric-label">Последняя подтверждённая точка</div><div>${esc(s.lastVerifiedCheckpoint||"Пока нет")}</div><hr><div class="metric-label">Следующее действие</div><div class="next">${esc(s.nextAction||"Не записано")}</div></div>`;
}
function apply(){if(window.MATRESHKA_RUN_STATE)render(window.MATRESHKA_RUN_STATE)}
function poll(){const old=document.getElementById("state-poll");if(old)old.remove();const sc=document.createElement("script");sc.id="state-poll";sc.src="dashboard-state.js?t="+Date.now();sc.onload=apply;sc.onerror=()=>{if(!lastGood)document.getElementById("app").textContent="Состояние dashboard недоступно. Проверьте ledger текущего run."};document.body.appendChild(sc)}
poll();setInterval(()=>{poll();if(lastGood)render(lastGood)},10000);
</script>
</body>
</html>
