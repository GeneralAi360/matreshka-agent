<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light;--ink:#162c36;--muted:#526770;--line:#d2dfe0;--teal:#12695e;--paper:#fff;--wash:#f0f5f4}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;overflow-wrap:anywhere}
main{max-width:1240px;margin:auto;padding:40px 24px 64px}header{border-top:5px solid var(--teal);padding:24px 0}h1{font-size:clamp(28px,4vw,42px);line-height:1.2;letter-spacing:-.025em;margin:10px 0 18px}h2{font-size:23px;line-height:1.3;margin:0 0 18px}h3{font-size:18px;margin:20px 0 8px}p{margin:8px 0 16px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:750}.muted,small{color:var(--muted)}small{font-size:13px}a{color:#0c615b;text-underline-offset:3px}a:focus-visible,summary:focus-visible{outline:3px solid #ce861a;outline-offset:4px}.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}.card,section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;margin:0 0 20px}.grid>.card{margin-bottom:0}.grid{margin-bottom:20px}.metric{font-size:38px;font-weight:750;line-height:1.2}.tag{display:inline-block;padding:3px 10px;border-radius:20px;background:#e9eff1;font-size:13px;line-height:1.6;font-weight:650;vertical-align:middle;margin:2px}.tag.VERIFIED,.tag.APPROVED,.tag.PASS{background:#def3e6;color:#165537}.tag.WAITING_APPROVAL,.tag.PENDING,.tag.IMPLEMENTED_UNVERIFIED,.tag.PARTIAL{background:#fff0cf;color:#78500b}.tag.BLOCKED,.tag.FAIL,.tag.REJECTED{background:#fce3df;color:#973a28}.note{border-left:4px solid #ba7d1e;background:#fff8e9;padding:12px 16px;border-radius:4px;margin:12px 0}.progress{height:8px;border-radius:8px;background:#e1e9e7;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:var(--teal)}details{border:1px solid var(--line);border-radius:10px;margin:12px 0;background:white}summary{padding:16px;cursor:pointer;font-weight:650}details>div{padding:0 18px 18px}details details{background:#f9fbfa}.row{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:var(--muted);font-size:12px}td,th{border-bottom:1px solid var(--line);padding:12px 10px;vertical-align:top}th:first-child,td:first-child{padding-left:0}code{font-size:12px;font-family:ui-monospace,monospace;white-space:normal}ul{padding-left:22px}li{margin:8px 0}.history{font-size:14px}.scope{color:var(--muted);font-size:13px}footer{padding:10px 4px;color:var(--muted);font-size:13px}.legend{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:680px){main{padding:16px 12px 40px}.grid{grid-template-columns:minmax(0,1fr)}.card,section{padding:18px}summary{padding:14px}td,th{padding:10px 7px;min-width:110px}.metric{font-size:32px}}@media print{body{background:white}main{max-width:none}details{break-inside:avoid}.grid{display:block}.card{margin-bottom:16px}}
</style></head><body><main>{{BODY}}</main>
<script type="application/json" id="matreshka-project-state">{{SNAPSHOT}}</script></body></html>
